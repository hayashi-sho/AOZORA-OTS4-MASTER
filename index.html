rceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":254,"subject":"法令","topic":"精選・指定数量","q":"第4類の「動植物油類」の指定数量は？","options":["200 L","1,000 L","2,000 L","6,000 L","10,000 L"],"answer":4,"explanation":"動植物油類の指定数量は10,000 Lです。","reasons":["200 Lは第1石油類・非水溶性です。","1,000 Lは第2石油類・非水溶性です。","2,000 Lは第3石油類・非水溶性などです。","6,000 Lは第4石油類です。","動植物油類の指定数量は10,000 Lです。"],"memory":"動植物油類は10,000 L。第4石油類6,000 Lと混同しない。","sourceUrl":"https://laws.e-gov.go.jp/law/334CO0000000306","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":255,"subject":"物化","topic":"精選・燃焼","q":"燃焼が継続するために必要な「燃焼の三要素」の組合せは？","options":["可燃物・酸素供給源・点火源","可燃物・窒素・水","酸素・水・二酸化炭素","温度計・湿度計・可燃物","燃料・水・冷却剤"],"answer":0,"explanation":"可燃物、酸素供給源、点火源の3つ。火災予防はどれかを取り除くことが基本です。","reasons":["可燃物、酸素供給源、点火源の3つ。火災予防はどれかを取り除くことが基本です。","水は燃焼の三要素に含まれません。窒素も一般には燃焼を助ける気体ではありません。","水と二酸化炭素は一般に消火で使われ、三要素ではありません。","測定器は三要素ではありません。","水・冷却剤は消火のために使うもので、燃焼の要素ではありません。"],"memory":"燃えるもの＋酸素＋火種。","sourceUrl":"https://www.fdma.go.jp/laws/laws/laws003.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":256,"subject":"物化","topic":"精選・燃焼","q":"引火点の説明として最も適切なものは？","options":["火源なしで自然に燃え始める温度","液体が必ず沸騰する温度","所定条件で火源により引火できる蒸気を発生する最低液温","液体が凍る温度","物質が必ず爆発する温度"],"answer":2,"explanation":"引火点は火源を近づけたときに引火できる蒸気が生じる最低液温を示します。","reasons":["これは発火点の説明に近いです。火源の要否が違います。","沸点は液体が沸騰する温度で、引火点とは異なります。","引火点は火源を近づけたときに引火できる蒸気が生じる最低液温を示します。","凝固点・融点の説明と混同しています。","引火点に達しても必ず爆発するわけではありません。"],"memory":"引火点＝「火を近づけたら」。発火点＝「火なしで」。","sourceUrl":"https://www.fdma.go.jp/laws/laws/laws003.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":257,"subject":"物化","topic":"精選・基礎","q":"液体の蒸発について正しい説明は？","options":["沸点より低くても液面から起こる","必ず100℃以上でしか起こらない","沸騰と完全に同じ現象である","液体を密閉しても蒸気圧は存在しない","蒸発には必ず炎が必要である"],"answer":0,"explanation":"蒸発は沸点未満でも液体表面から起こります。ガソリンの蒸気危険を理解する基本です。","reasons":["蒸発は沸点未満でも液体表面から起こります。ガソリンの蒸気危険を理解する基本です。","100℃は標準気圧での水の沸点の目安。一般の液体の蒸発条件ではありません。","沸騰は液体内部で気泡を生じる現象で、表面蒸発とは区別します。","密閉容器でも気液平衡に応じた蒸気圧が生じます。","熱エネルギーは関係しますが、炎がなくても蒸発します。"],"memory":"「蒸発＝表面から、沸騰＝液体内部にも気泡」。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":258,"subject":"物化","topic":"精選・基礎","q":"蒸気密度が空気より大きい可燃性蒸気は、漏れたときどうなる傾向がある？","options":["必ず真上へ上昇する","低い場所に滞留しやすい","酸素を必ず発生する","引火しなくなる","空気と混ざることが絶対にない"],"answer":1,"explanation":"低所・溝・ピットなどに滞留しやすく、遠方の火源にも注意が必要です。","reasons":["空気より重い蒸気は、一般に上方より低所に流れ込みやすいです。","低所・溝・ピットなどに滞留しやすく、遠方の火源にも注意が必要です。","蒸気密度と酸素発生は無関係です。","滞留すると引火リスクが増す場合があります。","拡散・混合は起こるため「絶対に混ざらない」は誤りです。"],"memory":"空気より重い蒸気＝低い場所に注意。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":259,"subject":"物化","topic":"精選・燃焼","q":"窒息消火の基本的な考え方は？","options":["酸素の供給を妨げる","燃料を増やす","着火源を加える","液体を加熱する","可燃性蒸気を集める"],"answer":0,"explanation":"燃焼に必要な酸素の供給を断つ・減らすのが窒息消火です。","reasons":["燃焼に必要な酸素の供給を断つ・減らすのが窒息消火です。","燃料を増やすと延焼危険が高まります。","着火源を加えると火災危険が高まります。","加熱は可燃性蒸気の発生などを促すおそれがあります。","可燃性蒸気を集めても窒息消火にはなりません。"],"memory":"窒息消火＝酸素供給を減らす。","sourceUrl":"https://www.fdma.go.jp/laws/laws/laws003.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":260,"subject":"性消","topic":"精選・ガソリン","q":"ガソリン蒸気が漏れた現場で特に注意する場所は？","options":["天井付近だけ","床下や溝など低い場所","水面下だけ","建物の外ならどこでも安全","密閉容器の中だけ"],"answer":1,"explanation":"空気より重いので低いくぼみや溝に滞留しやすくなります。","reasons":["ガソリン蒸気は空気より重いため天井付近だけでは足りません。","空気より重いので低いくぼみや溝に滞留しやすくなります。","水中だけに限らず床面付近にも広がります。","屋外でも近くの火源により引火する危険があります。","漏れた蒸気は容器外にも拡散します。"],"memory":"ガソリン蒸気は空気より重い。低所にたまる。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":261,"subject":"性消","topic":"精選・ガソリン","q":"ガソリンを移し替える際の静電気対策として適切なのは？","options":["流速をできるだけ速くする","容器や設備の帯電防止措置を行う","乾いた布で激しくこする","周囲で火気を使って換気する","電気スイッチを頻繁に操作する"],"answer":1,"explanation":"適切な容器・接地等、設備に応じた帯電防止措置が重要です。","reasons":["速すぎる流れは静電気発生を増やす場合があります。","適切な容器・接地等、設備に応じた帯電防止措置が重要です。","摩擦によって静電気を増やしかねません。","火気の使用は厳禁です。","スイッチ火花も着火源になり得ます。"],"memory":"液体の流動は帯電の原因。接地・火気管理をセットで覚える。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":262,"subject":"性消","topic":"精選・火災予防","q":"ガソリンを灯油用の一般的なポリ容器に入れて保管してよいか？","options":["いつでもよい","容器が赤色ならよい","少量なら必ずよい","消防法令に適合したガソリン用容器を使う","蓋を開ければよい"],"answer":3,"explanation":"ガソリンに適合する容器が必要です。灯油用ポリ容器は代用しません。","reasons":["容器の材質・性能には基準があります。何でもよいわけではありません。","色だけで法令適合は判定できません。","量が少なくても不適合な容器を使ってよいとは限りません。","ガソリンに適合する容器が必要です。灯油用ポリ容器は代用しません。","開放すると蒸気が出やすくなり危険です。"],"memory":"ガソリンは「専用・適合容器」。灯油用ポリ容器は不可。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":263,"subject":"性消","topic":"精選・ガソリン","q":"ガソリンの引火危険について正しい説明は？","options":["気温が低ければ必ず安全","引火点は約−40℃で低温でも引火危険がある","蒸気は空気より必ず軽い","蒸気を吸い込んでも健康への影響はない","火源がなくても必ず自然発火する"],"answer":1,"explanation":"ガソリンは引火点が非常に低く、小さな火源や静電気に注意が必要です。","reasons":["常温より低くてもガソリン蒸気は発生します。","ガソリンは引火点が非常に低く、小さな火源や静電気に注意が必要です。","ガソリン蒸気は空気より重く低所に滞留しやすいです。","蒸気へのばく露にも注意が必要です。","引火点が低いことと自然発火することは別です。"],"memory":"引火点約−40℃。温度が低くても着火源に注意。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"},{"id":264,"subject":"性消","topic":"精選・火災予防","q":"第4類の引火性液体が漏れたとき、まず避けるべき行動は？","options":["周囲への注意喚起","安全な場所への退避","火花を生じ得る機器の不用意な操作","関係者への通報","安全を確保した上での所定の対応"],"answer":2,"explanation":"スイッチ等の操作で火花が生じるおそれがあり、着火源を作る行動は避けます。","reasons":["周囲の人に危険を知らせることは重要です。","人命を守るための退避は適切です。","スイッチ等の操作で火花が生じるおそれがあり、着火源を作る行動は避けます。","必要な連絡・通報は安全な場所から行います。","安全な対応は状況と手順に応じて実施します。"],"memory":"漏えい時は火花を作らず、安全確保・退避・通報を優先。","sourceUrl":"https://www.pref.osaka.lg.jp/o020100/hoantaisaku/kikenbutu/index.html","sourceLabel":"官公庁等の公開資料","qualityLevel":"一次資料と基本事項を個別照合（専門家監修ではありません）"}];

 if(q.subject==='法令'&&q.topic==='指定数量'){
  const num=Number(actual.replace(/[, ]/g,'').replace(/L$/i,''));
  if(Number.isFinite(num)&&QUANTITY[num])return `${actual} は「${QUANTITY[num]}」で使われる指定数量です。問われている危険物の区分とは一致しません。`;
 }
 if(/倍数|計算/.test(q.topic)&&/倍/.test(actual)) return `${actual} は正しい合計ではありません。各品名の数量をそれぞれの指定数量で割った後、倍数を加算してください。`;
 if(q.topic==='消火'||q.topic==='燃焼')return `「${actual}」では、この問題で問われた燃焼・消火の仕組みを説明できません。正解の働きと区別しましょう。`;

}
function reasonFor(q,opt){
 const original=QUESTIONS.find(x=>x.id===q.id);
 const index=original?original.options.indexOf(opt):-1;
 const authored=CHOICE_REASONS[String(q.id)];
 return index>=0&&authored&&authored[index]?authored[index]:selectWhy(q,opt);
}
function errorContrast(q,pick){
 const options=q.shown||q.options, right=q.correct??q.answer;
 if(pick===undefined||pick===right)return '';
 return `<div class="contrast"><b>🔎 選んだ答えを比較</b><p>あなた：${escapeExplain(options[pick])}</p><p>正解：${escapeExplain(options[right])}</p><p>${escapeExplain(reasonFor(q,options[pick]))}</p></div>`;
}
function detailedExplanation(q,pick){
 const opts=q.shown||q.options, right=q.correct??q.answer;

}

// Three-stage teaching presentation; avoids pretending generic distractor text is personalized AI reasoning.
function studyExplanation(q,pick){

}

function study(){layout(`<section class="panel"><div class="eyebrow">PRACTICE MODE</div><h2>問題演習 v11</h2><p class="muted">問題を解いたらすぐに解説を確認。精選15問では各選択肢の専用説明を表示します。残り249問は従来教材で、全問の専門家監修は未完了です。</p><div class="stack"><button class="btn primary" id="mix">全分野ランダム 20問</button><button class="btn" id="lessonStart">📖 やさしい1分講座（14テーマ）</button>${subjects.map(s=>`<button class="btn" data-sub="${s}">${nameOf[s]}（${availableQuestions().filter(q=>q.subject===s).length}問）</button>`).join('')}<button class="btn" id="weak">間違い・理解不足の復習</button><button class="btn" id="notebook">📝 間違えた選択肢のノートを見る</button><button class="btn primary" id="quality">📘 精選・5択すべて個別解説（15問）</button><button class="btn" id="verified">📑 公式根拠付き・計算応用20問（新31問から）</button><button class="btn" id="adaptive">🧠 弱点優先・復習期限順 20問</button><button class="btn" id="focus">🎯 苦手単元を優先 15問</button><button class="btn" id="trap">⚠ ひっかけ集中 15問</button><button class="btn" id="flagged">🔎 要確認問題を見直す（${Object.keys(store.flags).length}問）</button><button class="btn" id="bookmarks">☆ ブックマーク演習（${Object.keys(store.bookmarks).length}問）</button></div></section>`);$('mix').onclick=()=>start('mixed');$('lessonStart').onclick=()=>{tab='lessons';render()};$('weak').onclick=()=>start('weak');$('notebook').onclick=()=>{tab='notebook';render()};$('adaptive').onclick=()=>start('adaptive');$('verified').onclick=()=>start('verified');$('quality').onclick=()=>start('quality');$('focus').onclick=()=>start('focus');$('bookmarks').onclick=()=>start('bookmarks');$('trap').onclick=()=>start('trap');$('flagged').onclick=()=>start('flagged');document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>start('subject',b.dataset.sub))}
function mock(){layout(`<section class="panel"><div class="eyebrow">MOCK EXAM</div><h2>本番形式 35問</h2><div class="grid"><div class="stat">法令<strong>15問</strong></div><div class="stat">物化<strong>10問</strong></div><div class="stat">性消<strong>10問</strong></div><div class="stat">制限時間<strong>120分</strong></div></div><p>本試験と同じ科目構成・時間・五肢択一で演習できます。途中では正誤を表示せず、最後に採点します。</p><p class="warn tiny">※未個別監修問題も含みます。要確認登録した問題は設定に応じて除外します。</p><p class="warn tiny">※問題は独自作成であり、本番問題・本番難易度の再現を保証するものではありません。</p><button class="btn primary full" id="start">模擬試験を開始</button></section>`);$('start').onclick=()=>start('mock')}
function start(mode,s){let selected;const pool=availableQuestions();if(mode==='notebook')selected=shuffle(pool.filter(q=>store.wrongNotes[q.id])).slice(0,10);else if(mode==='quality')selected=shuffle(QUALITY_QUESTIONS.filter(eligible));else if(mode==='verified')selected=shuffle(VERIFIED_QUESTIONS.filter(eligible)).slice(0,20);else if(mode==='mock')selected=subjects.flatMap(sub=>shuffle(pool.filter(q=>q.subject===sub)).slice(0,sub==='法令'?15:10));else if(mode==='weak')selected=pool.filter(q=>store.mistakes[q.id]||store.confused[q.id]);else if(mode==='flagged')selected=QUESTIONS.filter(q=>safeQuestion(q)&&store.flags[q.id]);else if(mode==='trap'){selected=pool.filter(isTrap).map(q=>({q,weight:(store.attempts[q.id]?.wrong||0)*20+(store.mistakes[q.id]?35:0)+(store.confused[q.id]?25:0)+(!store.answers[q.id]?13:0)+Math.random()*12})).sort((a,b)=>b.weight-a.weight).slice(0,15).map(x=>x.q)}else if(mode==='bookmarks')selected=pool.filter(q=>store.bookmarks[q.id]);else if(mode==='adaptive'){let ranked=pool.map(q=>({q,score:(store.mistakes[q.id]?100:0)+(store.confused[q.id]?90:0)+(store.confidence[q.id]==='low'?70:0)+(due(q)?35:0)+(store.mastery[q.id]?Math.max(0,20-(store.mastery[q.id].level||0)*8):25)+Math.random()*12}));ranked.sort((a,b)=>b.score-a.score);selected=ranked.slice(0,20).map(x=>x.q)}else if(mode==='focus'){let groups={};for(let q of pool){let k=q.subject+'|'+q.topic;groups[k]??={all:0,wrong:0,unseen:0};groups[k].all++;if(store.mistakes[q.id])groups[k].wrong++;if(!store.answers[q.id])groups[k].unseen++}selected=pool.map(q=>{let g=groups[q.subject+'|'+q.topic];return {q,score:g.wrong/g.all*80+g.unseen/g.all*18+(store.mistakes[q.id]?55:0)+(store.confused[q.id]?65:0)+(store.confidence[q.id]==='low'?65:0)+(due(q)?18:0)+Math.random()*14}}).sort((a,b)=>b.score-a.score).slice(0,15).map(x=>x.q)}else if(mode==='subject')selected=pool.filter(q=>q.subject===s);else selected=shuffle(pool).slice(0,mode==='quick'?10:20);if(mode==='mock'&&selected.length!==35){alert('安全に出題できる問題数が不足しています。要確認の除外設定を確認してください。');return}if(!selected.length){alert('まだ復習対象の問題がありません。先に問題演習をしてください。');return}session={mode,qs:questionsRandom(selected),index:0,picks:{},revealed:{},started:Date.now(),finished:false};store.sessions++;persistSession();questionView()}
function questionView(){if(!session)return;let i=session.index,q=session.qs[i],pick=session.picks[q.id],revealed=!!session.revealed[q.id],isMock=session.mode==='mock';let remaining=Math.max(0,7200-Math.floor((Date.now()-session.started)/1000));layout(`<section class="panel"><div class="row"><span class="pill">${isMock?'模擬試験':'演習'} · ${nameOf[q.subject]}</span><span class="tiny" id="timer">${isMock?timeFmt(remaining):''}</span></div><div class="row"><h2>${i+1} / ${session.qs.length}</h2><span class="tiny">${esc(q.topic)} ${qualityBadge(q)}${store.flags[q.id]?' ・ <b class="warn">要確認登録中</b>':''}${isTrap(q)?" ・ ⚠ "+trapLabel(q):""}</span></div><div class="progress"><div style="width:${(i+1)/session.qs.length*100}%"></div></div><div class="row"><div class="question">${esc(q.q)}</div><button class="bookmark ${store.bookmarks[q.id]?'on':''}" id="bookmark" aria-label="ブックマーク">${store.bookmarks[q.id]?'★':'☆'}</button></div><div class="options">${q.shown.map((o,j)=>`<button class="option ${revealed?(j===q.correct?'correct':j===pick?'wrong':''):j===pick?'selected':''}" data-pick="${j}" ${revealed?'disabled':''}><span class="num">${j+1}.</span><span>${esc(o)}</span></button>`).join('')}</div>${!revealed&&!isMock?questionHint(q):''}${revealed?`<div class="feedback ${pick===q.correct?'good':'bad'}"><b>${pick===q.correct?'✓ 正解！':'× 不正解'}</b><div>正解：${q.correct+1}. ${esc(q.shown[q.correct])}</div><div>${esc(q.explanation)}</div>${sourceInfo(q)}${mistakenReason(q,pick)}${qualityInfo(q,pick)}</div><details class="explain-section" ${pick!==q.correct?'open':''}><summary>📘 なぜ間違えた？ やさしい解説を読む</summary>${studyExplanation(q,pick)}<div class="stack"><button class="btn" id="confused">${store.confused[q.id]?'✓ 復習リストに登録済み':'🔖 まだ理解できない・復習する'}</button><button class="btn" id="understood">✓ 理解できた・復習マークを解除</button><div class="confidence"><p class="tiny">理解度を自己評価（次回の出題に反映）</p><div class="flexbtn"><button class="btn ${store.confidence[q.id]==='low'?'confidence-active':''}" id="lowConfidence">まだ不安</button><button class="btn ${store.confidence[q.id]==='high'?'confidence-active':''}" id="highConfidence">自分で説明できる</button></div></div></div></details>`:''}<div class="flexbtn">${i>0?'<button class="btn" id="prev">← 前の問題</button>':''}${!isMock&&!revealed?'<button class="btn primary" id="check" '+(pick===undefined?'disabled':'')+'>答え合わせ</button>':`<button class="btn primary" id="next">${i===session.qs.length-1?'採点する':'次の問題 →'}</button>`}</div>${isMock?'<p class="tiny">模試は解答後も選択を変更できます。未回答は不正解になります。</p>':''}${isMock?`<div class="history"><div class="tiny">問題一覧（● 解答済み・○ 未回答）</div><div class="palette" id="palette">${session.qs.map((x,j)=>`<button class="${j===i?'current':''} ${session.picks[x.id]!==undefined?'answered':''}" data-jump="${j}" aria-label="第${j+1}問へ移動">${session.picks[x.id]!==undefined?'●':'○'}${j+1}</button>`).join('')}</div></div>`:''}<div class="divider"></div><button class="btn full" id="flagQuestion">${store.flags[q.id]?'✓ 要確認に登録済み（解除）':'🔎 この問題の内容を要確認に登録'}</button><p class="tiny">疑わしい設問を保存できます。登録は内容の誤りを確定するものではありません。</p><button class="btn full" id="end">途中終了して採点</button></section>`);
$('flagQuestion').onclick=()=>{if(store.flags[q.id])delete store.flags[q.id];else store.flags[q.id]=true;save();questionView()};$('bookmark').onclick=()=>{if(store.bookmarks[q.id])delete store.bookmarks[q.id];else store.bookmarks[q.id]=true;persistSession();questionView()};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{session.picks[q.id]=Number(b.dataset.pick);persistSession();questionView()});if($('confused'))$('confused').onclick=()=>{store.confused[q.id]=true;save();questionView()};if($('understood'))$('understood').onclick=()=>{delete store.confused[q.id];save();questionView()};if($('lowConfidence'))$('lowConfidence').onclick=()=>{store.confidence[q.id]='low';store.confused[q.id]=true;save();questionView()};if($('highConfidence'))$('highConfidence').onclick=()=>{store.confidence[q.id]='high';delete store.confused[q.id];save();questionView()};if($('check'))$('check').onclick=()=>{session.revealed[q.id]=true;record(q,session.picks[q.id]===q.correct);persistSession();questionView()};if($('next'))$('next').onclick=()=>{if(i===session.qs.length-1)finish();else{session.index++;persistSession();questionView()}};if($('prev'))$('prev').onclick=()=>{session.index--;persistSession();questionView()};$('end').onclick=()=>{if(confirm('途中終了して採点しますか？ 未回答は不正解になります。'))finish()};if(isMock){const bar=document.getElementById('palette');if(bar)bar.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{session.index=Number(b.dataset.jump);persistSession();questionView()});clearInterval(clock);clock=setInterval(()=>{if(!session||session.mode!=='mock'){clearInterval(clock);return}let rem=7200-Math.floor((Date.now()-session.started)/1000);if(rem<=0){clearInterval(clock);finish();return}let t=$('timer');if(t)t.textContent=timeFmt(rem)},1000)}}
function qualityInfo(q,pick){if(!q.reasons)return '';let chosen=pick===undefined?'未回答':q.shown[pick];return `<div class="quality-box"><b>📘 全選択肢の個別解説</b><p class="tiny">各選択肢に対して、その答えを選ぶべきかを説明しています。</p>${q.shown.map((o,i)=>{let original=q.options.indexOf(o);return `<div class="quality-choice"><b>${i+1}. ${esc(o)} ${i===q.correct?'✓ 正解':i===pick?'← あなたの回答':''}</b><p>${esc(q.reasons[original])}</p></div>`}).join('')}<p><b>覚え方：</b>${esc(q.memory)}</p><p class="tiny">出典：<a href="${esc(q.sourceUrl)}" target="_blank" rel="noopener noreferrer">公開資料を確認 ↗</a></p><p class="tiny">個別に作成・点検した問題です。専門家による全問監修済みという意味ではありません。</p></div>`}function qualityBadge(q){return q.reasons?'<span class="pill">📘 選択肢別解説付き</span>':'<span class="pill">従来の練習問題・未個別監修</span>'}
function sourceInfo(q){return VERIFIED_IDS.has(q.id)?`<div class="evidence"><b>📑 出典確認済み（2026-11-04）</b><p>危険物の規制に関する政令 第1条の11・別表第三の指定数量を使用。</p>${q.steps?`<div class="teach-formula">途中式：${esc(q.steps)}</div>`:''}<a href="${VERIFIED_SOURCE}" target="_blank" rel="noopener noreferrer">e-Gov法令で指定数量を確認 ↗</a><p class="tiny">出典の照合は指定数量に限定しています。全問の専門家監修を意味しません。</p></div>`:''}
function timeFmt(x){return `${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`}
function record(q,correct){if(!correct&&session&&session.picks[q.id]!==undefined){const choice=q.shown[session.picks[q.id]];store.wrongNotes[q.id]={choice,category:errorCategory(q,choice),at:new Date().toISOString()}}let at=store.attempts[q.id]||{total:0,wrong:0};at.total++;if(!correct)at.wrong++;store.attempts[q.id]=at;recordActivity();let old=store.mastery[q.id]||{level:0};let level=correct?Math.min(5,(old.level||0)+1):0;let intervals=[0,1,3,7,14,30];store.mastery[q.id]={level,due:Date.now()+intervals[level]*86400000,seen:(old.seen||0)+1};store.answers[q.id]={correct,at:new Date().toISOString()};if(correct)delete store.mistakes[q.id];else store.mistakes[q.id]=true;save()}
function finish(){if(!session||session.finished)return;session.finished=true;clearInterval(clock);let results=subjects.map(s=>{let qs=session.qs.filter(q=>q.subject===s);return {s,total:qs.length,score:qs.filter(q=>session.picks[q.id]===q.correct).length}});for(let q of session.qs)if(session.mode==='mock'||(session.picks[q.id]!==undefined&&!session.revealed[q.id]))record(q,session.picks[q.id]===q.correct);let passed=session.mode==='mock'&&results.every(r=>r.score>=Math.ceil(r.total*.6));let summary={date:new Date().toISOString(),mode:session.mode,results,passed};store.savedSession=null;if(session.mode==='mock'){store.history.unshift(summary);store.history=store.history.slice(0,50)}save();let sessionPicks={...session.picks};let qs=session.qs,correct=qs.filter(q=>session.picks[q.id]===q.correct).length;session=null;layout(`<section class="panel"><div class="eyebrow">RESULT</div><h2>${summary.mode==='mock'?(passed?'<span class="success">合格基準達成！</span>':'<span class="warn">合格基準まであと一歩</span>'):'演習おつかれさま！'}</h2><div class="big">${correct} <span class="muted" style="font-size:18px">/ ${qs.length}問</span></div><p>正答率 ${Math.round(correct/qs.length*100)}%</p><div class="divider"></div>${results.filter(r=>r.total).map(r=>`<div class="history row"><span>${nameOf[r.s]}</span><strong class="${r.score>=Math.ceil(r.total*.6)?'success':'warn'}">${r.score}/${r.total}（${Math.round(100*r.score/r.total)}%）</strong></div>`).join('')}<p class="tiny">${summary.mode==='mock'?'3科目それぞれ60%以上が合格基準。':'正誤履歴と弱点を保存しました。'}</p><details class="history" open><summary><b>全問題の答え・解説を見る</b></summary>${qs.map((q,i)=>`<details class="review"><summary><span class="${sessionPicks[q.id]===q.correct?'success':'error'}">${sessionPicks[q.id]===q.correct?'✓':'×'}</span> ${i+1}. ${esc(q.q)}</summary><p class="tiny">${esc(nameOf[q.subject])} / ${esc(q.topic)}</p><p>あなたの回答：${sessionPicks[q.id]===undefined?'未回答':esc(q.shown[sessionPicks[q.id]])}</p><p class="success">正解：${esc(q.shown[q.correct])}</p><p>${esc(q.explanation)}</p>${sourceInfo(q)}${qualityInfo(q,sessionPicks[q.id])}${studyExplanation(q,sessionPicks[q.id])}</details>`).join('')}</details><div class="stack"><button class="btn primary" id="retry">間違えた問題を復習</button><button class="btn" id="home">ホームに戻る</button></div></section>`);$('retry').onclick=()=>start('weak');$('home').onclick=()=>{tab='home';render()}}
const CARDS=[['ガソリンの指定数量','200 L'],['灯油・軽油の指定数量','1000 L'],['重油の指定数量','2000 L'],['アルコール類の指定数量','400 L'],['特殊引火物の指定数量','50 L'],['動植物油類の指定数量','10000 L'],['第4石油類の指定数量','6000 L'],['第1石油類（水溶性）の指定数量','400 L'],['第2石油類（水溶性）の指定数量','2000 L'],['第3石油類（水溶性）の指定数量','4000 L'],['燃焼の三要素','可燃物・酸素供給源・点火源'],['引火点','火源で引火する蒸気を発生する最低液温'],['発火点','火源なしで自ら発火する最低温度'],['第1石油類の引火点','21℃未満'],['第2石油類の引火点','21℃以上70℃未満'],['第3石油類の引火点','70℃以上200℃未満'],['第4石油類の引火点','200℃以上250℃未満'],['合格基準','法令・物化・性消の各科目で60%以上'],['本番の問題数','35問：法令15／物化10／性消10'],['本番の制限時間','120分（免除なし）'],['免状写真の書換え','10年以内ごと'],['危険物保安監督者の基本要件','甲種または該当乙種免状 ＋ 6か月以上の実務経験']];
function flash(){let c=CARDS[flashIndex%CARDS.length];layout(`<section class="panel"><div class="eyebrow">FLASH CARDS</div><div class="row"><h2>重要暗記カード</h2><span class="pill">${flashIndex+1} / ${CARDS.length}</span></div><div class="flash" id="flip"><small>${flashBack?'ANSWER':'QUESTION'} · タップして裏返す</small><div>${esc(flashBack?c[1]:c[0])}</div></div><div class="flexbtn" style="margin-top:15px"><button class="btn" id="back">← 前へ</button><button class="btn primary" id="next">次へ →</button></div><p class="tiny">重要数値を暗記しましょう。分類の例外や条件は問題解説・公式法令も確認してください。</p></section>`);$('flip').onclick=()=>{flashBack=!flashBack;flash()};$('back').onclick=()=>{flashIndex=(flashIndex-1+CARDS.length)%CARDS.length;flashBack=false;flash()};$('next').onclick=()=>{flashIndex=(flashIndex+1)%CARDS.length;flashBack=false;flash()}}
function topicStats(){const m={};for(const q of QUESTIONS){let k=q.subject+'・'+q.topic;m[k]??={seen:0,ok:0,total:0};m[k].total++;if(store.answers[q.id]){m[k].seen++;if(store.answers[q.id].correct)m[k].ok++}}return Object.entries(m).filter(([,v])=>v.seen>0).sort((a,b)=>a[1].ok/a[1].seen-b[1].ok/b[1].seen).slice(0,12).map(([k,v])=>`<div class="history row"><span>${esc(k)}</span><b class="${v.ok/v.seen<.6?'warn':'success'}">${v.ok}/${v.seen} (${Math.round(v.ok/v.seen*100)}%)</b></div>`).join('')||'<p class="tiny">演習すると単元別の正答率を表示します。</p>'}
function stats(){let recent=store.history;let saved=Object.values(store.mastery);let mastery=saved.filter(x=>x.level>=3).length;layout(`<section class="panel"><div class="eyebrow">ANALYTICS</div><h2>学習成績</h2><button id="notesStats" class="btn full">📝 誤答ノートを確認（${Object.keys(store.wrongNotes).length}問）</button><p>解答済み問題：${Object.keys(store.answers).length} / ${QUESTIONS.length}問 ／ 定着レベル3以上：${mastery}問</p><p>今日の学習：${store.activity[today()]||0}問 ／ 連続学習：${streak()}日</p><label class="tiny" for="goal">1日の学習目標</label><select id="goal">${[5,10,15,20,30,50].map(v=>`<option value="${v}" ${store.dailyGoal===v?'selected':''}>${v}問</option>`).join('')}</select>${subjects.map(s=>{let p=percent(s);return `<div class="history"><div class="row"><span>${nameOf[s]}</span><b>${p===null?'未学習':p+'%'}</b></div><div class="bar"><i style="width:${p||0}%"></i></div></div>`}).join('')}<p class="tiny">各問題の最後の回答で集計しています。繰り返し学習すると変動します。</p></section><section class="panel"><h2>単元別の苦手ランキング</h2>${topicStats()}</section><section class="panel"><h2>間違いが多い問題 TOP10</h2>${Object.entries(store.attempts).filter(([id,x])=>x.wrong>0&&QUESTIONS.some(q=>q.id===Number(id))).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,10).map(([id,x])=>{let q=QUESTIONS.find(q=>q.id===Number(id));return `<div class="history"><b>${esc(q.subject)} / ${esc(q.topic)}：${esc(q.q)}</b><div class="tiny">間違い ${x.wrong}回 / 解答 ${x.total}回</div></div>`}).join('')||'<p class="tiny">学習すると表示されます。</p>'}</section><section class="panel"><h2>要確認に登録した問題</h2><p>${Object.keys(store.flags).length}件を登録中。問題演習から見直せます。正誤の判定はご自身で公式資料と照合してください。</p><button class="btn full" id="flaggedStats">要確認だけを解く</button></section><section class="panel"><h2>品質チェック・出題設定</h2><p>収録${QUESTIONS.length}問 ／ 形式検査エラー ${INVALID_IDS.size}問 ／ 自分で要確認にした問題 ${Object.keys(store.flags).length}問</p><p class="tiny">形式検査では選択肢数・重複・正解の範囲等を検査します。法令・科学的な正確性は自動保証できません。</p><label class="setting"><input type="checkbox" id="excludeFlagged" ${store.excludeFlagged?'checked':''}>要確認の問題を通常演習・模試から除外する</label><p class="tiny">精選15問は選択肢別解説付き。指定数量照合31問とその他218問は、解説品質が一律ではありません。疑問がある問題は要確認に登録してください。</p></section><section class="panel"><h2>模擬試験の履歴</h2>${recent.length?recent.map(h=>`<div class="history"><div class="row"><b>${new Date(h.date).toLocaleString('ja-JP')}</b><span class="${h.passed?'success':'warn'}">${h.passed?'基準達成':'未達成'}</span></div><div class="tiny">${h.results.map(r=>`${r.s} ${r.score}/${r.total}`).join(' ・ ')}</div></div>`).join(''):'<p class="muted">模擬試験を受けると履歴が表示されます。</p>'}</section><section class="panel"><h2>データ管理</h2><p class="tiny">学習記録はこの端末・ブラウザ内に保存されます。別端末とは同期しません。</p><div class="stack"><button class="btn" id="export">学習記録をJSONで保存</button><button class="btn" id="importBtn">バックアップを読み込む</button><input id="import" type="file" accept="application/json,.json" hidden><button class="btn" id="reset">学習記録をすべて削除</button></div></section>`);$('flaggedStats').onclick=()=>start('flagged');$('notesStats').onclick=()=>{tab='notebook';render()};$('excludeFlagged').onchange=e=>{store.excludeFlagged=e.target.checked;save();render()};$('goal').onchange=e=>{store.dailyGoal=Number(e.target.value);save();render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'AOZORA OTSU4',version:1,data:store},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aozora_otsu4_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.app!=='AOZORA OTSU4'||!d.data||typeof d.data!=='object')throw Error('形式が違います');if(confirm('現在の学習記録を上書きしますか？')){store=d.data;store.answers??={};store.mistakes??={};store.history??=[];store.sessions??=0;store.bookmarks??={};store.mastery??={};store.activity??={};store.dailyGoal??=10;store.savedSession??=null;store.confused??={};store.confidence??={};store.flags??={};store.attempts??={};store.excludeFlagged??=true;store.wrongNotes??={};store.recheck??={};save();render()}}catch(err){alert('読み込み失敗：'+err.message)}};$('reset').onclick=()=>{if(confirm('すべての学習記録を完全に削除しますか？')){store={answers:{},mistakes:{},history:[],sessions:0,bookmarks:{},mastery:{},activity:{},dailyGoal:10,savedSession:null,confused:{},confidence:{},flags:{},attempts:{},excludeFlagged:true,wrongNotes:{},recheck:{}};save();render()}}}

function tools(){const items=[['特殊引火物',50],['第1石油類（非水溶性）',200],['第1石油類（水溶性）',400],['アルコール類',400],['第2石油類（非水溶性）',1000],['第2石油類（水溶性）',2000],['第3石油類（非水溶性）',2000],['第3石油類（水溶性）',4000],['第4石油類',6000],['動植物油類',10000]];let rows=items.map(([name,val],i)=>`<div class="calcrow"><label>${name}<small>指定数量 ${val.toLocaleString()} L</small></label><input data-mul="${val}" type="number" min="0" step="any" inputmode="decimal" placeholder="数量 L" aria-label="${name}の数量"></div>`).join('');layout(`<section class="panel"><div class="eyebrow">QUANTITY CALCULATOR</div><h2>指定数量 倍数計算</h2><p class="tiny">それぞれの数量（L）を入力すると倍数の合計を計算します。乙4の学習用簡易計算であり、実施設の法令適合判定には使用しないでください。</p>${rows}<div class="stat"><span class="tiny">合計指定数量の倍数</span><strong id="mult" aria-live="polite">0.000 倍</strong></div><button class="btn full" id="calcClear">入力をクリア</button><div class="divider"></div><h2>試験攻略のヒント</h2><p>指定数量の倍数 = 実際の数量 ÷ 指定数量。複数品名はそれぞれ計算して合計します。</p><p class="tiny">危険物の法令上の区分や指定数量は各製品の性質・条件により判断が必要です。塗料や混合溶剤はSDS等で確認してください。</p></section>`);const ins=[...document.querySelectorAll('[data-mul]')];const update=()=>{$('mult').textContent=ins.reduce((acc,x)=>acc+(Math.max(0,Number(x.value)||0)/Number(x.dataset.mul)),0).toFixed(3)+' 倍'};ins.forEach(x=>x.oninput=update);$('calcClear').onclick=()=>{ins.forEach(x=>x.value='');update()}}

function lessons(){
 const categories=['すべて','法令','物化','性消'];
 const category=store.lessonCategory||'すべて';
 const filtered=LESSONS.map((l,i)=>({...l,index:i})).filter(l=>category==='すべて'||l.subject===category);
 const completed=Object.values(store.lessonDone||{}).filter(Boolean).length;
 layout(`<section class="panel"><div class="eyebrow">MICRO LESSONS · 5.0</div><h2>わかるまで1分講座</h2><p class="muted">問題を解く前に、言葉の意味と例えから理解。重要ポイントを確認してから同じ分野の練習に進めます。</p><div class="row"><span class="pill">全${LESSONS.length}テーマ</span><span class="pill">確認済み ${completed}テーマ</span></div><div class="lesson-tabs">${categories.map(c=>`<button class="btn ${category===c?'primary':''}" data-filter="${c}">${c}</button>`).join('')}</div>${filtered.map(l=>`<details class="lesson-card"><summary><span>${store.lessonDone?.[l.index]?'✓ ':'📘 '}${esc(l.title)}</span><small>${esc(l.subject)} · 約1分</small></summary><p class="lead">${esc(l.lead)}</p><ol>${l.steps.map(st=>`<li>${esc(st)}</li>`).join('')}</ol><div class="teach-highlight"><b>セルフチェック：</b>${esc(l.check)}</div><div class="flexbtn"><button class="btn" data-done="${l.index}">${store.lessonDone?.[l.index]?'✓ 確認済み':'✓ 理解できた'}</button><button class="btn primary" data-practice="${l.index}">このテーマを問題演習</button></div></details>`).join('')}</section>`);
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{store.lessonCategory=b.dataset.filter;save();lessons()});
 document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{store.lessonDone??={};store.lessonDone[b.dataset.done]=!store.lessonDone[b.dataset.done];save();lessons()});
 document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{let lesson=LESSONS[Number(b.dataset.practice)];let matching=QUESTIONS.filter(q=>q.subject===lesson.subject&&(q.topic===lesson.search||q.topic.includes(lesson.search)));if(!matching.length)matching=QUESTIONS.filter(q=>q.subject===lesson.subject);const selected=shuffle(matching).slice(0,10);session={mode:'lesson',qs:questionsRandom(selected),index:0,picks:{},revealed:{},started:Date.now(),finished:false};store.sessions++;persistSession();questionView()});
}
function render(){clearInterval(clock);if(tab==='home')home();else if(tab==='study')study();else if(tab==='mock')mock();else if(tab==='flash')flash();else if(tab==='tools')tools();else if(tab==='lessons')lessons();else if(tab==='notebook')notebook();else stats()}
render();
})();

</script></body></html>
